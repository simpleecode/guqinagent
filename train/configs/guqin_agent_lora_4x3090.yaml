### Rendered by train/scripts/render_train_config.py before launch.

### model
model_name_or_path: __MODEL_PATH__
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
quantization_bit: 4
quantization_method: bitsandbytes

### dataset
dataset: guqin_agent_train
dataset_dir: __DATASET_DIR__
template: qwen3_5
train_on_prompt: false
# Keep every assistant/function target supervised if a future dataset record contains multiple turns.
mask_history: false
cutoff_len: __CUTOFF_LEN__
max_samples: __MAX_SAMPLES__
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: __OUTPUT_DIR__
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
# 1 x 8 x 4 = 32 effective batch, copied from the validated 4 x RTX 3090 recipe.
per_device_train_batch_size: 1
gradient_accumulation_steps: __GRADIENT_ACCUMULATION_STEPS__
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
fp16: false
gradient_checkpointing: true
# Offload checkpointed hidden states to CPU; available in this LLaMA-Factory checkout
# without installing the full Unsloth package. This trades speed/RAM for VRAM.
use_unsloth_gc: true
flash_attn: auto
enable_liger_kernel: true
ddp_timeout: 180000000
